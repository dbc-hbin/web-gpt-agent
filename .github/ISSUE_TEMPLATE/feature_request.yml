name: Feature request
description: Suggest a concrete improvement to Chat On Steroids.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the workflow or limitation first. A new permanently exposed MCP
        tool is intentionally a high bar; many workflows belong on the existing primitives.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what blocks or slows you down today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include workarounds or existing tools/workflows you tried.
